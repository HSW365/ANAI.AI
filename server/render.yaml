services:
  - type: web
    name: anai-server
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_SHARED_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://anaiai.co,capacitor://localhost
      - key: PORT
        value: 3001
